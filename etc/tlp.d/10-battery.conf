# Conservative AC/battery policy for an AMD laptop.
# Keep all CPU cores, Bluetooth, and USB audio fully functional.

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# Keep firmware defaults rather than forcing potentially unstable ASPM levels.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default

# Avoid Bluetooth and USB audio interruptions from autosuspend.
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
